name: measure

# Measure the sourced corpus (data branch) into the measured dataset (measured
# branch), using the published `gocar-index`.
#
# Triggered by workflow_run, not `push`: corpus.yml pushes the data branch with
# the default GITHUB_TOKEN, and such pushes deliberately do not start other
# workflows. `main` carries the pipeline; this job only ever writes `measured`.
on:
  workflow_run:
    workflows: [corpus]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corpus-measured
  cancel-in-progress: false

jobs:
  measure:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # The syn-level analysis is minutes; the T-27/T-28 compiler passes build
    # every release's dependency graph (a full `cargo rustdoc` + `cargo check`
    # per version), which is the dominant cost. A release that cannot build
    # records null (best-effort), so a slow/flaky build degrades rather than
    # fails. Raise this if the corpus grows.
    timeout-minutes: 360
    steps:
      - name: Check out main (pipeline)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure a current Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Cache cargo registry and installed tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-gocar-index-0.5.0

      - name: Install the measurement tool
        run: cargo install gocar-index --version 0.5.0

      - name: Check out the data branch
        run: |
          git fetch --depth 1 origin data:data
          git worktree add in data

      - name: Check out the measured branch (create if absent)
        run: |
          if git ls-remote --exit-code --heads origin measured >/dev/null 2>&1; then
            git fetch --depth 1 origin measured:measured
            git worktree add out measured
          else
            # First run: bootstrap an empty measured branch. main's files must
            # not leak onto it, so drop the checked-out tree before generating.
            git worktree add --detach out
            git -C out checkout --orphan measured
            git -C out rm -rf --quiet . 2>/dev/null || true
          fi

      - name: Measure the corpus into the dataset
        run: |
          set -o pipefail
          python3 pipeline/measure.py --data in --out out | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit and push the measured dataset
        working-directory: out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "measured dataset unchanged — measured branch not moved"
            exit 0
          fi
          git commit -m "measured: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD:measured
