name: measure

# Measure the sourced corpus (data branch) into the measured dataset (measured
# branch), using the published `gocar-index`.
#
# The measured branch also carries `attestations/` — the per-release TVM/EAC
# docs and the index that says which of them still hold. They are what lets a
# run skip the compiler passes for releases whose inputs have not moved
# (`pipeline/attestations.py`), so they are committed with the dataset.
#
# Triggered by workflow_run, not `push`: corpus.yml pushes the data branch with
# the default GITHUB_TOKEN, and such pushes deliberately do not start other
# workflows. `main` carries the pipeline; this job only ever writes `measured`.
on:
  workflow_run:
    workflows: [corpus]
    types: [completed]
  workflow_dispatch:
    inputs:
      reuse:
        description: "Reuse the attestations already measured (uncheck to re-measure every release)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: corpus-measured
  cancel-in-progress: false

jobs:
  measure:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # The syn-level analysis is minutes; the T-27/T-28 compiler passes build
    # every release's dependency graph (a full `cargo rustdoc` + `cargo check`
    # per version), which is the dominant cost — a run that reuses every
    # attestation pays only the lock resolutions, and a floor build additionally
    # pays its own dep graph per distinct declared MSRV. A release that cannot
    # build records null (best-effort), so a slow/flaky build degrades rather
    # than fails. Raise this if the corpus grows.
    timeout-minutes: 360
    steps:
      - name: Check out main (pipeline)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure a current Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Cache cargo registry, installed tools and floor toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.rustup/toolchains
          # A fixed key is written once: a toolchain the corpus starts declaring
          # *after* the first save is re-downloaded every run until this key is
          # bumped — the same discipline as the pinned tool version below.
          key: ${{ runner.os }}-gocar-index-0.5.0-toolchains

      - name: Install the measurement tool
        run: |
          # Keep in sync with the cache key above.
          version=0.5.0
          stamp="$HOME/.cargo/bin/.gocar-index-version"
          # No-op when the cache above restored the pinned build: `cargo install`
          # refuses to overwrite an existing binary ("binary `gocar-index`
          # already exists in destination"), and a reinstall is a full rebuild.
          # The stamp sits in the cached `~/.cargo/bin` itself, so it is restored
          # and invalidated together with the binary; cargo's own `install --list`
          # bookkeeping can't be used here because `~/.cargo/.crates.toml` is not
          # among the cached paths and would be missing on a hit.
          if [ -x "$HOME/.cargo/bin/gocar-index" ] \
             && [ "$(cat "$stamp" 2>/dev/null)" = "$version" ]; then
            echo "gocar-index $version already installed — skipping cargo install"
          else
            # --force: replace whatever a hit under an older key left behind.
            cargo install gocar-index --version "$version" --force
            printf '%s\n' "$version" > "$stamp"
          fi

      - name: Check out the data branch
        run: |
          git fetch --depth 1 origin data:data
          git worktree add in data

      - name: Install the declared MSRV toolchains
        run: |
          set -o pipefail
          # The EAC pass attempts a floor build under a release's declared
          # rust-version where that compiler is installed; the pipeline prints
          # exactly the ones it will ask for (padded specs, below the active
          # compiler), so this installs the names the pass later uses.
          toolchains=$(python3 pipeline/measure.py --data in --floor-toolchains)
          if [ -n "$toolchains" ]; then
            echo "floor toolchains: $toolchains"
            rustup toolchain install --profile minimal $toolchains
          else
            echo "no declared MSRV below the active compiler — no floor is attempted"
          fi

      - name: Check out the measured branch (reuse it when it exists)
        run: |
          # A hosted runner starts with no local `measured`, so a bare fetch
          # reports `* [new branch] measured -> measured`: that is git creating
          # the *local* ref from the remote one, not a new branch upstream.
          # `--quiet` drops that misleading line, and the echo below states
          # which path was taken and which commit (the remote tip) landed.
          if git ls-remote --exit-code --heads origin measured >/dev/null 2>&1; then
            git fetch --depth 1 --quiet origin measured:measured
            git worktree add out measured
            echo "reusing the measured branch at $(git -C out rev-parse --short=12 HEAD) — $(git -C out log -1 --format=%s)"
          else
            # First run: bootstrap an empty measured branch. main's files must
            # not leak onto it, so drop the checked-out tree before generating.
            git worktree add --detach out
            git -C out checkout --orphan measured
            git -C out rm -rf --quiet . 2>/dev/null || true
            echo "origin has no measured branch yet — bootstrapped an empty one"
          fi

      - name: Measure the corpus into the dataset
        env:
          REUSE: ${{ inputs.reuse }}
        run: |
          set -o pipefail
          args=()
          if [ "$REUSE" = "false" ]; then args+=(--no-reuse); fi
          python3 pipeline/measure.py --data in --out out "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit and push the measured dataset
        working-directory: out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "measured dataset unchanged — measured branch not moved"
            exit 0
          fi
          git commit -m "measured: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD:measured
