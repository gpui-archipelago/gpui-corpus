name: corpus

# Source version data into incremental blobs on the `data` branch.
# `main` carries the pipeline; this job only ever writes `data`.
on:
  schedule:
    - cron: "0 5 * * *" # daily, after the crates.io index settles
  workflow_dispatch:
    inputs:
      only:
        description: "Force-refetch specs (comma-separated PKG@VERS)"
        required: false
      providers:
        description: "Limit to provider ids (comma-separated)"
        required: false
      dry_run:
        description: "Report only; write and push nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: corpus-data
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out main (pipeline + curation)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check out the derived data branch (create if absent)
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth 1 origin data:data
            git worktree add out data
          else
            # First run: bootstrap an empty data branch. main's files must not
            # leak onto data, so drop the checked-out tree before generating.
            git worktree add --detach out
            git -C out checkout --orphan data
            git -C out rm -rf --quiet . 2>/dev/null || true
          fi

      - name: Source version data into blobs
        env:
          ONLY: ${{ inputs.only }}
          PROVIDERS: ${{ inputs.providers }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -o pipefail
          args=()
          if [ -n "$ONLY" ]; then
            IFS=',' read -ra specs <<< "$ONLY"
            for spec in "${specs[@]}"; do args+=(--only "$spec"); done
          fi
          if [ -n "$PROVIDERS" ]; then
            IFS=',' read -ra ids <<< "$PROVIDERS"
            for id in "${ids[@]}"; do args+=(--provider "$id"); done
          fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          echo "python3 pipeline/fetch_corpus.py --out out ${args[*]}"
          python3 pipeline/fetch_corpus.py --out out "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit and push new blobs to data
        if: ${{ inputs.dry_run != true }}
        working-directory: out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no new releases — data branch unchanged"
            exit 0
          fi
          git commit -m "corpus: source version data"
          git push origin HEAD:data
